name: Release

# A tag vX.Y.Z (the version in Cargo.toml) builds the binaries, publishes them in a GitHub release and pushes the
# Docker images to ghcr.io. Run by hand (workflow_dispatch), it builds everything and publishes nothing: the
# archives are kept as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, docker: amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, docker: arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - name: Build
        shell: bash
        run: |
          # Windows: the C runtime linked in, so that the binary needs nothing installed
          if [[ "$TARGET" == *windows* ]]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name=pixel-cast-$version-$TARGET
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "../target/$TARGET/release/pixel-cast.exe" "$name/"
            7z a -bd "$name.zip" "$name" > /dev/null
            archive=$name.zip
          else
            cp "../target/$TARGET/release/pixel-cast" "$name/"
            tar -czf "$name.tar.gz" "$name"
            archive=$name.tar.gz
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi > "$archive.sha256"
          rm -r "$name"
      - name: Keep the Linux binary for the Docker images
        if: matrix.docker
        run: |
          mkdir -p dist/docker/${{ matrix.docker }}
          cp "target/$TARGET/release/pixel-cast" "dist/docker/${{ matrix.docker }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-linux-musl"
          merge-multiple: true
          path: dist
      - name: Put the binaries in place
        run: |
          mkdir -p docker/amd64 docker/arm64
          install -m 755 dist/docker/amd64/pixel-cast docker/amd64/pixel-cast
          install -m 755 dist/docker/arm64/pixel-cast docker/arm64/pixel-cast
      - name: Tags
        id: tags
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "minimal=$IMAGE:$version,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          echo "ffmpeg=$IMAGE:$version-ffmpeg,$IMAGE:ffmpeg" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: minimal
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.minimal }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ffmpeg
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.ffmpeg }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            ./*.tar.gz ./*.zip SHA256SUMS
