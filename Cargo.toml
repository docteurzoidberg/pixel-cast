[package]
name = "pixel-cast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Stream test patterns, images, GIFs and videos to LED matrices over E1.31 (sACN)"
license = "MIT"
repository = "https://github.com/docteurzoidberg/pixel-cast"
readme = "README.md"
keywords = ["sacn", "e131", "dmx", "led", "matrix"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
directories = "6.0.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
toml = "1.2.3"
